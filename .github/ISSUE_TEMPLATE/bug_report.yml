name: Bug report
description: Report a reproducible problem in Researk or its documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Researk. A pre-alpha source build exists, but there is no installable GitHub Release or native package. Source-build, behavior, test, and documentation defects are welcome.

        Do not include credentials, private manuscripts, participant data, proprietary datasets, or unpublished research. Use a minimal synthetic example.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this problem.
          required: true
        - label: I removed or replaced all secrets and sensitive research data.
          required: true
        - label: I can provide a minimal, reproducible example or precise documentation location.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Documentation or specification
        - CLI or terminal rendering
        - Harness or execution pipeline
        - Provider integration
        - Configuration or sessions
        - Packaging or installation
        - Security or permissions
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Use a commit hash, source checkout state, or "documentation only". No release version exists yet.
      placeholder: "commit abc1234"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, installation method, terminal, and shell when relevant.
      placeholder: "Windows 11 x64; source checkout; Windows Terminal; PowerShell 7"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest ordered sequence that demonstrates the problem.
      placeholder: |
        1. Start with ...
        2. Run or open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact safe error text or documentation conflict.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add redacted logs, screenshots, or links. Dragging files here uploads them publicly.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Note workarounds, frequency, regressions, or related issues.
