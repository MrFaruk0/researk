name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Clean and verify source
        run: |
          npm run clean
          npm run build
          npm run typecheck
          npm test
          npm run lint
          npm run format-check
          git diff --check
          node packages/cli/dist/bin.js help

      - name: Build and smoke-test the standalone CLI artifact offline
        shell: bash
        run: |
          artifact_root="$RUNNER_TEMP/researk-standalone-artifacts"
          smoke_root="$RUNNER_TEMP/researk-standalone-smoke"
          release_version="$(node -p "require('./package.json').version")"
          npm run pack:standalone -- --output "$artifact_root"
          npm run smoke:standalone -- --artifact "$artifact_root/researk-${release_version}.tgz" --root "$smoke_root"
